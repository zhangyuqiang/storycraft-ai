version: '3.9'

services:
  backend:
    image: golang:1.22
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "go run ."
    ports:
      - "8080:8080"
    environment:
      - PORT=8080

  frontend:
    image: node:20
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
